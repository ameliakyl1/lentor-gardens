<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Amelia Lek — Huttons Asia">
  <!--
    Agent's own initials mark. This deliberately does NOT use the project or developer logo:
    the browser tab is a branding surface, and showing a developer's mark there implies an
    affiliation this independent marketing site does not have. An earlier build shipped a
    developer monogram inherited from the site template. Keep this mark agent-owned.
    Colours are this site's own palette tokens: forest green + porcelain.
  -->
  <rect width="64" height="64" fill="#1C3923"/>
  <text
    x="32"
    y="33"
    fill="#F5F4EE"
    font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif"
    font-size="30"
    font-weight="600"
    letter-spacing="1"
    text-anchor="middle"
    dominant-baseline="central"
  >AL</text>
</svg>
